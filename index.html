<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MFG Daily record</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #1f2937;
      --border: #d1d5db;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      padding: 20px 14px;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      padding: 24px 20px;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 22px;
    }

    p.sub {
      margin: 0 0 20px 0;
      font-size: 13px;
      color: #6b7280;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 12px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label.title {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .req {
      color: #dc2626;
      margin-right: 3px;
    }

    input[type="text"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .cb-item {
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
    }

    .cb-item:hover {
      background-color: #f9fafb;
    }

    .cb-item input {
      margin-right: 8px;
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      background: var(--primary);
      color: #ffffff;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .msg {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }

    .msg-success {
      background: #ecfdf5;
      color: #065f46;
      border: 1px solid #a7f3d0;
    }

    .msg-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>MFG Daily record</h1>
  <p class="sub">提交后数据将自动同步记录至 Notion 数据库</p>

  <form id="notionForm">
    <div class="form-group">
      <label class="title" for="date"><span class="req">*</span>Date</label>
      <input type="date" id="date" required />
    </div>

    <div class="form-group">
      <label class="title" for="team"><span class="req">*</span>Team</label>
      <select id="team" required>
        <option value="" disabled selected>请选择 Team...</option>
        <option value="Assembly">Assembly</option>
        <option value="Test">Test</option>
      </select>
    </div>

    <div class="form-group">
      <label class="title" for="name"><span class="req">*</span>Name</label>
      <input type="text" id="name" placeholder="请输入姓名" required />
    </div>

    <div class="form-group">
      <label class="title"><span class="req">*</span>Product Model (可多选)</label>
      <div class="grid">
        <label class="cb-item"><input type="checkbox" name="model" value="P-series" /> P-series</label>
        <label class="cb-item"><input type="checkbox" name="model" value="P170" /> P170</label>
        <label class="cb-item"><input type="checkbox" name="model" value="D500/D600" /> D500/D600</label>
        <label class="cb-item"><input type="checkbox" name="model" value="HRP" /> HRP</label>
        <label class="cb-item"><input type="checkbox" name="model" value="Z-20" /> Z-20</label>
        <label class="cb-item"><input type="checkbox" name="model" value="Z-300/Z-388" /> Z-300/Z-388</label>
      </div>
    </div>

    <div class="form-group">
      <label class="title" for="utid"><span class="req">*</span>UTID (数字)</label>
      <input type="number" id="utid" placeholder="例如: 1024" required />
    </div>

    <div class="form-group">
      <label class="title" for="progress"><span class="req">*</span>Progress %</label>
      <input type="number" id="progress" min="0" max="100" placeholder="0 - 100" required />
    </div>

    <div class="form-group">
      <label class="title" for="remark">Remark (备注)</label>
      <textarea id="remark" rows="2" placeholder="选填：异常或补充说明"></textarea>
    </div>

    <button type="submit" id="btn">提交记录至 Notion</button>
    <div class="msg" id="msgBox"></div>
  </form>
</div>

<script>
  // ================= 请在此处填入您的 Make.com Webhook 完整网址 =================
  const WEBHOOK_URL = "https://hook.eu1.make.com/k3vu2ezj7roxjxn2o3td58lvxf43jua5";
  // =========================================================================

  // 默认自动填入今天日期
  const d = new Date();
  document.getElementById("date").value = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

  document.getElementById("notionForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const models = Array.from(document.querySelectorAll('input[name="model"]:checked')).map(cb => cb.value);
    if (models.length === 0) {
      alert("请至少勾选一个 Product Model！");
      return;
    }

    const btn = document.getElementById("btn");
    const msgBox = document.getElementById("msgBox");
    btn.disabled = true;
    btn.textContent = "正在同步至 Notion...";
    msgBox.style.display = "none";

    const payload = {
      date: document.getElementById("date").value,
      team: document.getElementById("team").value,
      name: document.getElementById("name").value.trim(),
      models: models,
      utid: Number(document.getElementById("utid").value.trim()),
      progress: Number(document.getElementById("progress").value.trim()),
      remark: document.getElementById("remark").value.trim()
    };

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (!response.ok) {
        throw new Error("HTTP status " + response.status);
      }

      msgBox.className = "msg msg-success";
      msgBox.textContent = "✅ 已成功提交并同步至 Notion 数据库！";
      msgBox.style.display = "block";

      // 提交成功后清空本次填写内容（保留日期、Team 和姓名方便连续填写）
      document.getElementById("utid").value = "";
      document.getElementById("progress").value = "";
      document.getElementById("remark").value = "";
      document.querySelectorAll('input[name="model"]:checked').forEach(cb => cb.checked = false);
    } catch (err) {
      msgBox.className = "msg msg-error";
      msgBox.textContent = "❌ 提交失败，请检查网络或确认 Webhook 链接是否正确。";
      msgBox.style.display = "block";
    } finally {
      btn.disabled = false;
      btn.textContent = "提交记录至 Notion";
    }
  });
</script>

</body>
</html>
